---
name: CI

"on":
  push:
    branches: [mainline]
  pull_request:
    branches: [mainline]

permissions:
  contents: read

env:
  REBAR3_VERSION: 3.28.0

jobs:
  rebar3:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Verify the pinned rebar3 release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL \
            "https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3" \
            -o rebar3
          gh attestation verify rebar3 \
            --repo erlang/rebar3 \
            --signer-workflow erlang/rebar3/.github/workflows/publish.yml \
            --deny-self-hosted-runners
          echo "sha256=$(sha256sum rebar3 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  test:
    needs: rebar3
    runs-on: ubuntu-latest
    container:
      # Digest-pinned: a tag can be re-pushed, a digest cannot. Keep in step
      # with Dockerfile.test's FROM.
      image: erlang:27.3.4.9-slim@sha256:a8403c4e5ec42d6b48fe023ae1afd4e0fcfcb7272a559a6c5aa69d2f9d05ff12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install build deps
        run: apt-get update && apt-get install -y make git curl

      - name: Install rebar3
        env:
          REBAR3_SHA256: ${{ needs.rebar3.outputs.sha256 }}
        run: |
          set -e
          curl -fsSL \
            "https://github.com/erlang/rebar3/releases/download/${REBAR3_VERSION}/rebar3" \
            -o /usr/local/bin/rebar3
          echo "${REBAR3_SHA256}  /usr/local/bin/rebar3" | sha256sum -c -
          chmod +x /usr/local/bin/rebar3
          rebar3 version

      - name: Run tests and build escript
        run: make local-test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Scan full history with Gitleaks
        run: make lint-secrets

  maybe_bump:
    needs: [rebar3, test, secrets]
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/mainline' &&
        ! startsWith(github.event.head_commit.message, 'Version bumped to')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump, tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python -m pip install avakas==3.2.0
          avakas bump . auto --branch=mainline --flavor erlang
          version=$(avakas show . --flavor erlang)
          if gh release view "$version" > /dev/null 2>&1; then
            echo "Release $version already exists, nothing to publish"
            exit 0
          fi
          # Empty notes on purpose: a human writes the release text. Avakas is
          # slated to generate it from CHANGELOG.md later.
          gh release create "$version" \
            --title "$version" \
            --notes "" \
            --verify-tag
